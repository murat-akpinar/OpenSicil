[package]
name = "worker"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
] }

ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
chacha20poly1305 = "0.10"
base64 = "0.22"

# rustls zaten agacta (sqlx ve ldap3 uzerinden, ring); ClientConfig kurmak icin dogrudan
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "test-util"] }
# Testler ../backend/migrations ile gecici DB kurar (ADR-070 ek); "migrate" yalnizca test derlemesinde
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "migrate",
] }
