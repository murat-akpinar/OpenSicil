[package]
name = "worker"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "test-util"] }
