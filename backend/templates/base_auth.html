<!doctype html>
<html lang="{{ lang.code() }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OpenSicil{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js"></script>
{% block head %}{% endblock %}
</head>
<body class="min-h-screen">
  <div class="flex min-h-screen items-center justify-center p-4">
    <div class="w-full max-w-md">
      <div class="mb-6 flex items-center justify-between">
        <span class="brand"><span class="brand-mark"><i class="ico ico-shield" aria-hidden="true"></i></span>OpenSicil</span>
        <button class="btn btn-ghost btn-sm ico ico-moon" id="theme-toggle" type="button" aria-label="{{ lang.t("shell.theme") }}"></button>
      </div>
      <div class="card">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
</body>
</html>
