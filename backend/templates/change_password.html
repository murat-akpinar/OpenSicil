{% extends "base_auth.html" %}
{% block title %}{{ lang.t("pw.title") }} — OpenSicil{% endblock %}
{% block content %}
<h1 class="h1 mb-1">{{ lang.t("pw.title") }}</h1>
<p class="muted mb-5 text-sm">{{ lang.t("pw.subtitle") }}</p>
{% if !error.is_empty() %}
<p class="alert alert-err">{{ error }}</p>
{% endif %}
<form method="post" action="/change-password">
  <div class="field">
    <label class="label" for="new_password">{{ lang.t("pw.new") }}</label>
    <input class="input" type="password" id="new_password" name="new_password" required minlength="12">
    <span class="hint">{{ lang.t("pw.min_hint") }}</span>
  </div>
  <div class="field">
    <label class="label" for="confirm_password">{{ lang.t("pw.repeat") }}</label>
    <input class="input" type="password" id="confirm_password" name="confirm_password" required minlength="12">
  </div>
  <button class="btn btn-primary w-full" type="submit">{{ lang.t("common.save") }}</button>
</form>
{% endblock %}
