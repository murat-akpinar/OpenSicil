{% extends "base_auth.html" %}
{% block title %}Parola Değiştir — OpenSicil{% endblock %}
{% block content %}
<h1 class="h1 mb-1">Parola değiştir</h1>
<p class="muted mb-5 text-sm">İlk girişte varsayılan parola değiştirilmelidir.</p>
{% if !error.is_empty() %}
<p class="alert alert-err">{{ error }}</p>
{% endif %}
<form method="post" action="/change-password">
  <div class="field">
    <label class="label" for="new_password">Yeni parola</label>
    <input class="input" type="password" id="new_password" name="new_password" required minlength="12">
    <span class="hint">En az 12 karakter.</span>
  </div>
  <div class="field">
    <label class="label" for="confirm_password">Yeni parola (tekrar)</label>
    <input class="input" type="password" id="confirm_password" name="confirm_password" required minlength="12">
  </div>
  <button class="btn btn-primary w-full" type="submit">Kaydet</button>
</form>
{% endblock %}
