{% extends "base.html" %}
{% block title %}Parola Değiştir — OpenSicil{% endblock %}
{% block content %}
<h1 class="text-xl font-semibold mb-6">Parola Değiştir</h1>
<p class="text-sm mb-4" style="color:#a6adc8;">İlk girişte varsayılan parola değiştirilmelidir.</p>
{% if !error.is_empty() %}
<p class="mb-4" style="color:#f38ba8;">{{ error }}</p>
{% endif %}
<form method="post" action="/change-password" class="space-y-4">
  <div>
    <label class="block text-sm mb-1" for="new_password">Yeni parola</label>
    <input class="w-full rounded px-3 py-2 text-black" type="password" id="new_password" name="new_password" required minlength="12">
  </div>
  <div>
    <label class="block text-sm mb-1" for="confirm_password">Yeni parola (tekrar)</label>
    <input class="w-full rounded px-3 py-2 text-black" type="password" id="confirm_password" name="confirm_password" required minlength="12">
  </div>
  <button class="w-full rounded py-2" style="background:#89b4fa; color:#1e1e2e;" type="submit">Kaydet</button>
</form>
{% endblock %}
