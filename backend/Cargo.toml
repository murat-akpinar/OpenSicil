[package]
name = "backend"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls-ring",
  "postgres",
  "migrate",
] }
askama = "0.12"
# AD bind giris kapisi (ADR-095 madde 1); ADR-069'da secilmis crate, worker'la ayni surum
ldap3 = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
# rustls zaten agacta (sqlx ve ldap3 uzerinden, ring); CA'li ClientConfig kurmak icin dogrudan
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
openidconnect = "4"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
