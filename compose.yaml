services:
  nginx:
    build:
      context: ./nginx
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ${TLS_CERT_PATH}:/etc/nginx/tls/cert.pem:ro
      - ${TLS_KEY_PATH}:/etc/nginx/tls/key.pem:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      # Arayuz kaynaklari (templates/assets/static/i18n) ayri bir baglamdan gelir;
      # backend'in `./backend` izolasyonu korunur (ADR-097).
      additional_contexts:
        frontend: ./frontend
    environment:
      DATABASE_URL: postgres://${POSTGRES_BACKEND_USER}:${POSTGRES_BACKEND_PASSWORD}@db:5432/${POSTGRES_DB}
      AEAD_MASTER_KEY: ${AEAD_MASTER_KEY}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY}
      PUBLIC_URL: ${PUBLIC_URL}
      METRICS_TOKEN: ${METRICS_TOKEN}
      OWNERSHIP_MODE_ENABLED: ${OWNERSHIP_MODE_ENABLED:-false}
      HOURLY_DESTRUCTIVE_LIMIT: ${HOURLY_DESTRUCTIVE_LIMIT:-50}
      HOURLY_GRANT_LIMIT: ${HOURLY_GRANT_LIMIT:-50}
      HOURLY_FIRST_PASSWORD_LIMIT: ${HOURLY_FIRST_PASSWORD_LIMIT:-50}
      EMERGENCY_QUOTA: ${EMERGENCY_QUOTA:-5}
      SENSITIVE_MAPPING_ENABLED: ${SENSITIVE_MAPPING_ENABLED:-false}
      # AD bind giris kapisi (ADR-095): backend de DC'nin CA'sini dogrular
      AD_CA_FILE: /etc/opensicil/ad-ca.pem
      TZ: ${TZ:-Europe/Istanbul}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ${AD_CA_PATH}:/etc/opensicil/ad-ca.pem:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  worker:
    build:
      context: ./worker
    environment:
      DATABASE_URL: postgres://${POSTGRES_WORKER_USER}:${POSTGRES_WORKER_PASSWORD}@db:5432/${POSTGRES_DB}
      AEAD_MASTER_KEY: ${AEAD_MASTER_KEY}
      BLIND_INDEX_KEY: ${BLIND_INDEX_KEY}
      OWNERSHIP_MODE_ENABLED: ${OWNERSHIP_MODE_ENABLED:-false}
      HOURLY_DESTRUCTIVE_LIMIT: ${HOURLY_DESTRUCTIVE_LIMIT:-50}
      HOURLY_GRANT_LIMIT: ${HOURLY_GRANT_LIMIT:-50}
      HOURLY_FIRST_PASSWORD_LIMIT: ${HOURLY_FIRST_PASSWORD_LIMIT:-50}
      EMERGENCY_QUOTA: ${EMERGENCY_QUOTA:-5}
      SENSITIVE_MAPPING_ENABLED: ${SENSITIVE_MAPPING_ENABLED:-false}
      AD_CA_FILE: /etc/opensicil/ad-ca.pem
      TZ: ${TZ:-Europe/Istanbul}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ${AD_CA_PATH}:/etc/opensicil/ad-ca.pem:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/worker", "worker-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  # ayni imajin tek seferlik "migrate" alt komutu, sema sahibi roluyle (ADR-015, ADR-061)
  migrate:
    build:
      context: ./backend
      additional_contexts:
        frontend: ./frontend
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_OWNER_USER}:${POSTGRES_OWNER_PASSWORD}@db:5432/${POSTGRES_DB}
      POSTGRES_BACKEND_USER: ${POSTGRES_BACKEND_USER}
      POSTGRES_BACKEND_PASSWORD: ${POSTGRES_BACKEND_PASSWORD}
      POSTGRES_WORKER_USER: ${POSTGRES_WORKER_USER}
      POSTGRES_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_OWNER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # 18+ imaji surum alt dizini (pg_ctlcluster duzeni) bekler; dogrudan
      # .../data'ya mount etmek "eski duzen" hatasiyla acilmaz (ADR yok, imaj davranisi)
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_OWNER_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
