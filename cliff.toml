# git-cliff yapılandırması. CHANGELOG.md bu dosyadan üretilir, elle düzenlenmez.

[changelog]
header = "# Değişiklik Günlüğü\n\n"
body = """
{% if version -%}
## {{ version | trim_start_matches(pat="v") }} — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Yayınlanmamış
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | upper_first }}
{%- endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "Özellikler" },
  { message = "^fix", group = "Düzeltmeler" },
  { message = "^perf", group = "Performans" },
  { message = "^refactor", group = "Yeniden düzenleme" },
  { message = "^test", group = "Testler" },
  { message = "^docs?", group = "Dokümantasyon" },
  { message = "^chore", group = "Bakım" },
  { message = "^build|^ci", group = "Yapı ve CI" },
  { message = "^revert", group = "Geri alınanlar" },
]
