# Backend'e vekillik eden her location bunu include eder (iki yerde: giris
# yollari ve geri kalan her sey; ikisi farkli hiz siniri tasiyor).
#
# `proxy_pass http://backend:8000` adi yalnizca acilista cozer ve IP'yi omur boyu
# tutar; backend container'i her yeniden olusturuldugunda yeni IP alir ve nginx
# eskisine baglanmaya calisip 502 verir. Degisken kullanilinca cozum istek aninda
# ve `resolver` ile yapilir, TTL dolunca yenilenir.
set $backend_upstream http://backend:8000;
proxy_pass $backend_upstream;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
# Backend ayakta degilken istemci 60 sn beklemesin, hata sayfasi hemen gelsin
proxy_connect_timeout 5s;
