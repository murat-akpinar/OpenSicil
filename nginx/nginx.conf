# nginxinc/nginx-unprivileged root olmayan kullanıcıyla çalışır; /run'a yazamaz
pid /tmp/nginx.pid;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server_tokens off;
    client_max_body_size 10m;

    # Kotu istekler: yavas istemci (slowloris) govdeyi/basligi damla damla
    # gonderip baglantiyi tutar; buyuk baslik yiginini da burada kesiyoruz.
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    large_client_header_buffers 4 16k;

    # IP basina hiz siniri. `web` normal gezinme icin genis, `login` kaba kuvvete
    # karsi dar: yerel hesabin 5 deneme/15 dk kilidi (ADR-095) uygulamada durur,
    # bu onun onundeki ag katmanidir ve denemeyi backend'e hic ulastirmaz.
    limit_req_zone $binary_remote_addr zone=web:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=12r/m;
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status 429;
    limit_conn_status 429;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Docker'in gomulu DNS'i; upstream adini istek aninda cozmek icin gerekli
    # (asagidaki `set $backend_upstream`). `ipv6=off`: compose agi IPv4,
    # AAAA sorgusu bosuna bir gidis donus.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP -> HTTPS yonlendirme (ADR-066: TLS bu referans dagitimda nginx'te sonlanir)
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        # compose healthcheck buraya bakar; /'e yonlendirme https://$host'a (443)
        # gider, o port container icinde acik degil (yalnizca host mapping'inde var)
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" always;

        # Uygulama yalnizca GET/HEAD/POST kullanir; gerisi tarayici degil tarayici
        # taramasidir, backend'e hic gitmez
        if ($request_method !~ ^(GET|HEAD|POST)$) {
            return 405;
        }

        limit_conn perip 24;

        # Backend dusukken (502/503/504) sayfayi nginx verir: binary'ye gomulu
        # arayuz CSS'i o an sunulamadigi icin bu sayfa kendi stilini tasir.
        # Yukari akimdan gelen 4xx/5xx'e dokunulmaz (`proxy_intercept_errors`
        # kapali): onlari backend kabugun icinde kendi cizer.
        error_page 500 502 503 504 /_err/50x.html;
        error_page 400 405 413 414 429 431 /_err/4xx.html;
        location /_err/ {
            alias /usr/share/nginx/html/_err/;
            access_log off;
        }

        # Giris yollari: kaba kuvvete karsi dar pencere
        location ~ ^/(login|change-password|oidc/) {
            limit_req zone=login burst=5 nodelay;
            include /etc/nginx/proxy.conf;
        }

        # ayri bir frontend yok (ADR-064): backend hem API'yi hem arayuzu sunar
        location / {
            limit_req zone=web burst=60 nodelay;
            include /etc/nginx/proxy.conf;
        }
    }
}
