# nginxinc/nginx-unprivileged root olmayan kullanıcıyla çalışır; /run'a yazamaz
pid /tmp/nginx.pid;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server_tokens off;
    client_max_body_size 10m;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Docker'in gomulu DNS'i; upstream adini istek aninda cozmek icin gerekli
    # (asagidaki `set $backend_upstream`). `ipv6=off`: compose agi IPv4,
    # AAAA sorgusu bosuna bir gidis donus.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # HTTP -> HTTPS yonlendirme (ADR-066: TLS bu referans dagitimda nginx'te sonlanir)
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        # compose healthcheck buraya bakar; /'e yonlendirme https://$host'a (443)
        # gider, o port container icinde acik degil (yalnizca host mapping'inde var)
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/cert.pem;
        ssl_certificate_key /etc/nginx/tls/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'" always;

        # ayri bir frontend yok (ADR-064): backend hem API'yi hem htmx arayuzunu sunar
        location / {
            # `proxy_pass http://backend:8000` adi yalnizca acilista cozer ve IP'yi
            # omur boyu tutar; backend container'i yeniden olusturulunca (her
            # `docker compose up -d backend`) yeni IP alir ve nginx eskisine
            # baglanmaya calisip 502 verir. Degisken kullanilinca cozum istek
            # aninda ve `resolver` ile yapilir, TTL dolunca yenilenir.
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
